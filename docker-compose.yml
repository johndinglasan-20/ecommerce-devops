version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8081:8081"
    depends_on:
      - db
    environment:
      # Sovrascriviamo l'URL per far comunicare i container tra loro
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ecommerce

volumes:
  postgres_data: